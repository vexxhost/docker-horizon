name: build

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
      - stable/**

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
      pull-requests: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: vexxhost/docker-atmosphere/.github/actions/checkout@d048c9245c93c10c06d42d1ea9311fcd3d416530 # main
        with:
          repository: openstack/horizon
          ref: 182ff902db0c7cfcac1b133857cc98476402b282 # master

      - uses: vexxhost/docker-atmosphere/.github/actions/checkout@d048c9245c93c10c06d42d1ea9311fcd3d416530 # main
        with:
          repository: openstack/designate-dashboard
          ref: 2562abf3bb916f74428fdb8f5eea153b0117a3c8 # master

      - uses: vexxhost/docker-atmosphere/.github/actions/checkout@d048c9245c93c10c06d42d1ea9311fcd3d416530 # main
        with:
          repository: openstack/heat-dashboard
          ref: 490f7f07d708de8a9e26672a0152b85eff8fdb77 # master

      - uses: vexxhost/docker-atmosphere/.github/actions/checkout@d048c9245c93c10c06d42d1ea9311fcd3d416530 # main
        with:
          repository: openstack/ironic-ui
          ref: 457ae742139812034574bca45581ecb6bf4749bc # master

      - uses: vexxhost/docker-atmosphere/.github/actions/checkout@d048c9245c93c10c06d42d1ea9311fcd3d416530 # main
        with:
          repository: openstack/magnum-ui
          ref: 226ccc54e57aa1c6a53bd8d60c23e047b7c35cdf # master

      - uses: vexxhost/docker-atmosphere/.github/actions/checkout@d048c9245c93c10c06d42d1ea9311fcd3d416530 # main
        with:
          repository: openstack/manila-ui
          ref: f4a2a5f87346b260c3f200e838e480e2a20eb1a5 # master

      - uses: vexxhost/docker-atmosphere/.github/actions/checkout@d048c9245c93c10c06d42d1ea9311fcd3d416530 # main
        with:
          repository: openstack/neutron-fwaas-dashboard
          ref: 738e31c0b43625d6ada04e8a84c834fd53cb3f63 # master

      - uses: vexxhost/docker-atmosphere/.github/actions/checkout@d048c9245c93c10c06d42d1ea9311fcd3d416530 # main
        with:
          repository: openstack/neutron-vpnaas-dashboard
          ref: 6dc8bf4d2c201bec7c2d8af46c83c13f09a97a7e # master

      - uses: vexxhost/docker-atmosphere/.github/actions/checkout@d048c9245c93c10c06d42d1ea9311fcd3d416530 # main
        with:
          repository: openstack/octavia-dashboard
          ref: 199a7af37f9c5a13c51ed5e388bff36fdfc013d0 # master

      - uses: vexxhost/docker-atmosphere/.github/actions/build-image@d048c9245c93c10c06d42d1ea9311fcd3d416530 # main
        with:
          image-name: horizon
          build-contexts: |
            horizon=openstack/horizon
            designate-dashboard=openstack/designate-dashboard
            heat-dashboard=openstack/heat-dashboard
            ironic-ui=openstack/ironic-ui
            magnum-ui=openstack/magnum-ui
            manila-ui=openstack/manila-ui
            neutron-fwaas-dashboard=openstack/neutron-fwaas-dashboard
            neutron-vpnaas-dashboard=openstack/neutron-vpnaas-dashboard
            octavia-dashboard=openstack/octavia-dashboard
          push: ${{ github.event_name != 'pull_request' }}
